name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - monitoring

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  IMAGE_NAME: churn-prediction
  TAG: alaa001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # Uncomment this block if you have tests
      # - name: Run Unit Tests
      #   run: PYTHONPATH=. pytest test/

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:${{ env.TAG }} .

      - name: Tag and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag $IMAGE_NAME:${{ env.TAG }} $ECR_REGISTRY/$IMAGE_NAME:${{ env.TAG }}
          docker push $ECR_REGISTRY/$IMAGE_NAME:${{ env.TAG }}
          echo "ECR_IMAGE=$ECR_REGISTRY/$IMAGE_NAME:${{ env.TAG }}" >> $GITHUB_ENV

      - name: Setup SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" | base64 --decode > ec2_key.pem
          chmod 400 ec2_key.pem

      - name: Deploy to EC2
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF
            set -e

            # Ensure Docker is installed
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              if [ -f /etc/debian_version ]; then
                sudo apt update && sudo apt install -y docker.io
              else
                sudo yum update -y && sudo yum install -y docker
              fi
              sudo systemctl start docker
              sudo usermod -aG docker $USER
            fi

            # Pull from GitHub
            REPO_NAME=$(basename "${{ github.repository }}")
            if [ ! -d "$REPO_NAME" ]; then
              git clone https://github.com/${{ github.repository }}.git
            fi

            cd $REPO_NAME
            git pull origin monitoring

            # Authenticate to ECR
            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} \
              | docker login --username AWS --password-stdin $ECR_REGISTRY

            # Update docker-compose image
            sed -i "s|image:.*|image: $ECR_IMAGE|" docker-compose.yml

            # Restart container
            docker-compose down || true
            docker-compose pull
            docker-compose up -d

            echo "✅ Deployment complete"
          EOF
