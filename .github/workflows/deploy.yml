name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - monitoring

env:
  IMAGE_NAME: churn-prediction
  TAG: mo001

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:mo001 .

      - name: Tag and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag churn-prediction:mo001 $ECR_REGISTRY/$IMAGE_NAME:mo001
          docker push $ECR_REGISTRY/$IMAGE_NAME:mo001
          echo "ECR_IMAGE=$ECR_REGISTRY/$IMAGE_NAME:mo001" >> $GITHUB_ENV

      - name: Deploy to EC2 with Appleboy SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo apt update -y || sudo yum update -y
            sudo apt install -y docker.io || sudo yum install -y docker
            sudo systemctl start docker || sudo service docker start

            aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | \
              docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

            docker pull ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/churn-prediction:mo001
            docker stop churn-prediction || true
            docker rm churn-prediction || true

            docker run -d -p 80:8005 --name churn-prediction:mo001 \
              ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/churn-prediction:mo001
