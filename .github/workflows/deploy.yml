name: CI/CD Pipeline - Deploy to AWS EC2

on:
  push:
    branches:
      - monitoring

env:
  IMAGE_NAME: churn-prediction
  TAG: mo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_NAME:$TAG .

      - name: Tag and Push to ECR
        env:
          ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
          IMAGE_NAME: churn-prediction
          TAG: mo
        run: |
          echo "ECR_REGISTRY=$ECR_REGISTRY"
          echo "IMAGE_NAME=$IMAGE_NAME"
          echo "TAG=$TAG"
          docker tag $IMAGE_NAME:$TAG $ECR_REGISTRY/$IMAGE_NAME:$TAG
          docker push $ECR_REGISTRY/$IMAGE_NAME:$TAG

      - name: Write SSH key to file
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy to EC2 manually via SSH
        env:
          AWS_REGION: ${{ secrets.AWS_REGION }}
          AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'ENDSSH'
            sudo apt update -y || sudo yum update -y
            sudo apt install -y docker.io || sudo yum install -y docker
            sudo systemctl start docker || sudo service docker start

            aws ecr get-login-password --region $AWS_REGION | \
              docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com

            docker pull $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/churn-prediction:mo
            docker stop churn-prediction || true
            docker rm churn-prediction || true

            docker run -d -p 80:8000 --name churn-prediction \
              $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/churn-prediction:mo
          ENDSSH
